<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFEFAE"/><stop offset="30%" stop-color="#F0C446"/><stop offset="70%" stop-color="#B3861B"/><stop offset="100%" stop-color="#FFEFAE"/></linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C48BE0"/><stop offset="50%" stop-color="#8A42B5"/><stop offset="100%" stop-color="#3F1260"/></linearGradient>
    <linearGradient id="accent" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#FFE066"/><stop offset="100%" stop-color="#9C7310"/></linearGradient>
    <radialGradient id="dark" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#3B1550"/><stop offset="100%" stop-color="#1A0826"/></radialGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF9E0"/><stop offset="100%" stop-color="#E8C55A"/></linearGradient>
    <radialGradient id="gloss" cx="35%" cy="22%" r="55%"><stop offset="0%" stop-color="#fff" stop-opacity=".5"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>

  <polygon points="50,6 88.1,28 88.1,72 50,94 11.9,72 11.9,28" fill="url(#gold)"/>
  <polygon points="50,9 85.5,29.5 85.5,70.5 50,91 14.5,70.5 14.5,29.5" fill="url(#purple)"/>
  <path d="m50 9 35.5 20.5L50 50Z" fill="url(#gold)" opacity=".25"/>
  <path d="m85.5 70.5L50 91V50Z" fill="url(#gold)" opacity=".2"/>
  <path d="m14.5 70.5L50 91V50Z" fill="url(#gold)" opacity=".35"/>
  <polygon points="50,11 83.5,30.5 83.5,69.5 50,89 16.5,69.5 16.5,30.5" fill="none" stroke="url(#gold)" stroke-width=".75"/>

  <circle cx="50" cy="48" r="25" fill="url(#dark)" stroke="url(#gold)" stroke-width="1.6"/>

  <!-- laurel wreath -->
  <g fill="url(#icon)" opacity=".95">
    <g id="leafset">
      <ellipse cx="34" cy="42" rx="2.6" ry="1.4" transform="rotate(-30 34 42)"/>
      <ellipse cx="32" cy="47" rx="2.8" ry="1.4" transform="rotate(-8 32 47)"/>
      <ellipse cx="32.5" cy="52.5" rx="2.8" ry="1.4" transform="rotate(15 32.5 52.5)"/>
      <ellipse cx="34.5" cy="57.5" rx="2.6" ry="1.4" transform="rotate(38 34.5 57.5)"/>
      <ellipse cx="38" cy="61.5" rx="2.4" ry="1.3" transform="rotate(58 38 61.5)"/>
    </g>
    <use href="#leafset" transform="scale(-1,1) translate(-100,0)"/>
  </g>
  <path d="M34 42q-4 10 4 20" fill="none" stroke="url(#icon)" stroke-width=".8" opacity=".7"/>
  <path d="M66 42q4 10 -4 20" fill="none" stroke="url(#icon)" stroke-width=".8" opacity=".7"/>

  <!-- commonwealth compass star -->
  <g stroke="#5A3E0A" stroke-width=".4" stroke-linejoin="round">
    <polygon points="50,32 53.2,45.2 66.5,48 53.2,50.8 50,64 46.8,50.8 33.5,48 46.8,45.2" fill="url(#icon)"/>
  </g>
  <polygon points="50,32 53.2,45.2 50,48 46.8,45.2" fill="#fff" opacity=".7"/>
  <circle cx="50" cy="48" r="2.3" fill="url(#gold)" stroke="#5A3E0A" stroke-width=".3"/>

  <ellipse cx="38" cy="26" rx="34" ry="16" fill="url(#gloss)"/>
</svg>
