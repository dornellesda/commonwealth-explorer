<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="wv-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#ECECF0"/>
      <stop offset="70%" stop-color="#B6B6BD"/>
      <stop offset="100%" stop-color="#8A8A91"/>
    </linearGradient>
    <linearGradient id="wv-silver-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F4"/>
      <stop offset="100%" stop-color="#9B9BA4"/>
    </linearGradient>
    <linearGradient id="wv-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8D9A"/>
      <stop offset="100%" stop-color="#B51E2E"/>
    </linearGradient>
    <radialGradient id="wv-red-core" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#7A1020"/>
      <stop offset="100%" stop-color="#3A060F"/>
    </radialGradient>
    <linearGradient id="wv-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#AFB3BD"/>
    </linearGradient>
    <radialGradient id="wv-gloss" cx="35%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- shield body -->
  <path d="M24 14H76Q82 14 82 20V68Q82 78 74 82L50 94 26 82Q18 78 18 68V20Q18 14 24 14Z" fill="url(#wv-silver)" stroke="#8B8B92" stroke-width="1.2"/>
  <path d="M26 17H74Q79 17 79 22V67Q79 75 72 79L50 90 28 79Q21 75 21 67V22Q21 17 26 17Z" fill="url(#wv-silver-dark)"/>
  <path d="M26 17H74Q79 17 79 22V67Q79 75 72 79L50 90 28 79Q21 75 21 67V22Q21 17 26 17Z" fill="none" stroke="#FFFFFF" stroke-width=".45" opacity=".7"/>

  <!-- crown -->
  <path d="M40 15 44 10 48 15 52 9 56 15 60 11 64 15 64 18H40Z" fill="url(#wv-silver)" stroke="#8B8B92" stroke-width=".6"/>
  <circle cx="44" cy="11" r=".8" fill="#D8D8DE"/>
  <circle cx="52" cy="10" r=".9" fill="#D8D8DE"/>
  <circle cx="60" cy="11" r=".8" fill="#D8D8DE"/>

  <!-- center medallion -->
  <circle cx="50" cy="51" r="21" fill="url(#wv-red)" stroke="url(#wv-silver)" stroke-width="1.8"/>
  <circle cx="50" cy="51" r="14.5" fill="url(#wv-red-core)"/>

  <!-- silver star -->
  <polygon points="50,33 53.4,45.2 66,45.2 55.8,52.7 59.7,64.8 50,57.5 40.3,64.8 44.2,52.7 34,45.2 46.6,45.2" fill="url(#wv-star)" stroke="#6F737A" stroke-width=".6"/>
  <polygon points="50,33 53.4,45.2 50,48.2 46.6,45.2" fill="#FFFFFF" opacity=".7"/>

  <ellipse cx="39" cy="27" rx="30" ry="14" fill="url(#wv-gloss)"/>
