<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="out" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity=".5" result="color"/>
      <feComposite in="color" in2="inverse" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".8" specularExponent="20" result="spec">
        <fePointLight x="35" y="25" z="40"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="deep-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A1A1C" flood-opacity=".5"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".8" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant=".6" specularExponent="15" result="spec" lighting-color="#fff">
        <fePointLight x="30" y="20" z="30"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3=".6" k4="0"/>
    </filter>
    <linearGradient id="rim-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#F0F0F5"/>
      <stop offset="35%" stop-color="#D1D1D8"/>
      <stop offset="55%" stop-color="#A8A8B0"/>
      <stop offset="75%" stop-color="#C8C8D0"/>
      <stop offset="90%" stop-color="#7A7A82"/>
      <stop offset="100%" stop-color="#B0B0B8"/>
    </linearGradient>
    <linearGradient id="rim-highlight" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="enamel-core" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0FFB0"/>
      <stop offset="25%" stop-color="#9AC840"/>
      <stop offset="60%" stop-color="#5A8E18"/>
      <stop offset="100%" stop-color="#2A4A08"/>
    </radialGradient>
    <radialGradient id="enamel-gloss" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="icon-metal" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E8E8F0"/>
      <stop offset="60%" stop-color="#B8B8C0"/>
      <stop offset="100%" stop-color="#6A6A72"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D0D0D8"/>
      <stop offset="100%" stop-color="#6A6A72"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="52" r="48" fill="#000" opacity=".08" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="47" fill="url(#rim-metal)" filter="url(#deep-shadow)"/>
  <circle cx="50" cy="50" r="47" fill="url(#rim-highlight)" opacity=".6"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#FFFFFF" stroke-width=".6" opacity=".7"/>
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#5A5A62" stroke-width=".8" opacity=".5"/>
  <circle cx="50" cy="50" r="44" fill="url(#rim-metal)" filter="url(#inner-shadow)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width=".5" opacity=".4"/>
  <circle cx="50" cy="50" r="41" fill="#1E1E24"/>
  <circle cx="50" cy="50" r="41" fill="url(#enamel-core)" opacity=".85"/>
  <circle cx="50" cy="50" r="41" fill="url(#enamel-gloss)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#3A4A18" stroke-width="1.2" opacity=".6"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#rim-metal)" stroke-width="2.5" opacity=".8"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FFFFFF" stroke-width=".5" opacity=".5"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#5A5A62" stroke-width=".6" opacity=".4"/>
  <circle cx="50" cy="50" r="32" fill="#141418"/>
  <circle cx="50" cy="50" r="32" fill="url(#enamel-core)" opacity=".7"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#icon-metal)" stroke-width="1" opacity=".6"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#FFFFFF" stroke-width=".3" opacity=".3"/>
  <g filter="url(#emboss)">
    <g stroke="url(#icon-metal)" stroke-width="2.2" stroke-linecap="round">
      <line x1="50" y1="26" x2="50" y2="74"/>
      <line x1="26" y1="50" x2="74" y2="50"/>
      <line x1="33" y1="33" x2="67" y2="67"/>
      <line x1="67" y1="33" x2="33" y2="67"/>
    </g>
    <circle cx="50" cy="50" r="18" fill="none" stroke="url(#icon-metal)" stroke-width="2.8" filter="url(#glow)"/>
    <g fill="url(#star)">
      <rect x="47.2" y="22.5" width="5.6" height="6.5" rx="1.6"/>
      <rect x="47.2" y="71" width="5.6" height="6.5" rx="1.6"/>
      <rect x="22.5" y="47.2" width="6.5" height="5.6" rx="1.6"/>
      <rect x="71" y="47.2" width="6.5" height="5.6" rx="1.6"/>
      <rect x="30" y="30" width="5.8" height="5.8" rx="1.5" transform="rotate(45 32.9 32.9)"/>
      <rect x="64.2" y="30" width="5.8" height="5.8" rx="1.5" transform="rotate(45 67.1 32.9)"/>
      <rect x="30" y="64.2" width="5.8" height="5.8" rx="1.5" transform="rotate(45 32.9 67.1)"/>
      <rect x="64.2" y="64.2" width="5.8" height="5.8" rx="1.5" transform="rotate(45 67.1 67.1)"/>
    </g>
  </g>
  <circle cx="50" cy="50" r="8.5" fill="url(#icon-metal)" stroke="#4A4A52" stroke-width=".8" filter="url(#bevel)"/>
  <circle cx="50" cy="50" r="8.5" fill="url(#enamel-gloss)"/>
  <circle cx="50" cy="50" r="7" fill="none" stroke="#FFFFFF" stroke-width=".8" opacity=".4"/>
  <circle cx="50" cy="50" r="3" fill="#1A1A20"/>
  <circle cx="50" cy="50" r="2.2" fill="url(#star)" stroke="#4A4A52" stroke-width=".3"/>
  <ellipse cx="36" cy="28" rx="35" ry="20" fill="url(#enamel-gloss)" opacity=".35"/>
  <ellipse cx="32" cy="24" rx="28" ry="14" fill="#FFFFFF" opacity=".08"/>
  <path d="M12 42 A38 38 0 0 1 42 12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".15" stroke-linecap="round"/>
</svg>
